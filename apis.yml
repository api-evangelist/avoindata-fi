aid: avoindata-fi
name: Avoindata.fi
description: >-
  Avoindata.fi is a national government open-data portal for Finland running CKAN.
  It exposes the CKAN catalog API, a standardized machine-readable interface over approximately 2,521 datasets,
  supporting programmatic dataset search, metadata retrieval, and resource access. Because it runs CKAN, it shares a
  consistent API surface with every other CKAN portal, making it uniformly harvestable and integrable.
kind: government
image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
url: https://raw.githubusercontent.com/api-evangelist/avoindata-fi/refs/heads/main/apis.yml
