apis:
  - aid: avoindata-fi:catalog
    name: Avoindata.fi CKAN Action API
    description: >-
      CKAN Action API for Avoindata.fi, a consistent JSON-over-HTTP interface over a catalog of 2,521 datasets. Standard actions include package_search, package_show, package_list, organization_list, group_list, tag_list, and resource_search; datastore_search is available where the DataStore extension is enabled. Base URL https://www.avoindata.fi/data/fi/api/3/action/.
    humanURL: https://www.avoindata.fi/data/fi
    baseURL: https://www.avoindata.fi/data/fi/api/3/action
